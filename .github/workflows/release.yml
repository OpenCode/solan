name: Release

# Build the wheel and publish it as a GitHub Release
# every time a pull request is merged into master.
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Read version
        id: version
        run: echo "tag=v$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::warning::Release $TAG already exists. Bump the version in pyproject.toml to publish a new one."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$TAG" \
            --notes "$PR_TITLE ($PR_URL)" \
            --generate-notes
