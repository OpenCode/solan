name: Release

# Every time a pull request is merged into master:
#  1. build the wheel and sdist and publish them as a GitHub Release
#  2. upload the same files to PyPI (only when step 1 created a new release)
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.publish.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Read version
        id: version
        run: echo "tag=v$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::warning::Release $TAG already exists. Bump the version in pyproject.toml to publish a new one."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$TAG" \
            --notes "$PR_TITLE ($PR_URL)" \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Keep built packages for PyPI
        if: steps.publish.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    # Trusted publishing: no API token, PyPI trusts this workflow via OIDC
    environment:
      name: pypi
      url: https://pypi.org/project/solan/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v6

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
